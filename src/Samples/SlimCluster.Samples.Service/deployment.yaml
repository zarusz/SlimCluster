apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sc-service
  labels:
    app: sc-service
    run: sc-service
spec:
  serviceName: sc-service-peers
  replicas: 3
  selector:
    matchLabels:
      run: sc-service
  template:
    metadata:
      labels:
        run: sc-service
    spec:
      containers:
      - name: sc-service
        image: zarusz/slimcluster_samples_service:latest
        imagePullPolicy: IfNotPresent # ensure we get always the fresh container image build
        ports:
        - containerPort: 8080
        - containerPort: 60001
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: RaftVoterIds__0
          value: sc-service-0
        - name: RaftVoterIds__1
          value: sc-service-1
        - name: RaftVoterIds__2
          value: sc-service-2
